<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b3048" />
    <meta name="description" content="Custom photo fridge magnets made locally by Jennifer Jacquot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fridge Magnets" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-startup-image" href="/logo.png" />
    <style>
      .initial-splash {
        width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 5vw, 56px);
        background: #fbf9f3;
      }

      .initial-splash img {
        width: min(90vw, 860px);
        max-height: 78vh;
        height: auto;
        display: block;
        object-fit: contain;
      }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <title>It's On The Fridge - Magnet Designer</title>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash" aria-label="It's On The Fridge loading">
        <img src="/logo.png" alt="It's On The Fridge Magnets" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
